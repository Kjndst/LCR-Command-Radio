[package]
name = "lcr-helper"
version = "0.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false }
semver = "=1.0.28"
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

[[bin]]
name = "LCR"
path = "src/main.rs"

[[bin]]
name = "LCRInputBroker"
path = "src/lcr_input_broker_main.rs"

[[test]]
name = "c3b_inherited_handle"
path = "tests/c3b_inherited_handle.rs"
harness = false

[[test]]
name = "u2_guard_handoff"
path = "tests/u2_guard_handoff.rs"
harness = false
